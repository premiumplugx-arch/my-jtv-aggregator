name: Refresh JTV Cache

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Prevents multiple runs from conflicting with each other
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git pull --rebase

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring

      - name: Run Aggregator and Save Output
        run: |
          # Check for syntax errors before running
          php -l shoebpl.php
          
          # Run the script and save output
          php shoebpl.php > channels.json
          
          echo "--- File size ---"
          wc -c channels.json
          echo "--- Channel count ---"
          php -r '$d=json_decode(file_get_contents("channels.json"),true); echo is_array($d)?count($d):"not an array";'

      - name: Commit Refreshed JSON
        run: |
          git config user.name  "jtv-bot"
          git config user.email "jtv-bot@users.noreply.github.com"
          git add channels.json
          git diff --staged --quiet || git commit -m "chore: refresh channels $(date -u +%FT%TZ)"
          
          # Pull latest changes to avoid push rejection
          git pull --rebase origin main
          git push
