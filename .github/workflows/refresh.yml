name: Refresh JTV Cache

on:
  schedule:
    # Runs every hour at minute 0 (UTC)
    - cron: '0 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # Required to commit and push the updated JSON file

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up PHP with required extensions
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring

      # 3. Run your PHP script and save its output to a JSON file
      - name: Run Aggregator and Save Output
        run: |
          php shoebpl.php > channels.json
          echo "--- File size ---"
          wc -c channels.json
          echo "--- Channel count ---"
          php -r '$d=json_decode(file_get_contents("channels.json"),true); echo is_array($d)?count($d):"not an array";'

      # 4. Commit the new JSON file back to the repository
      - name: Commit Refreshed JSON
        run: |
          git config user.name  "jtv-bot"
          git config user.email "jtv-bot@users.noreply.github.com"
          git add channels.json
          # The 'diff' command prevents an error if the file hasn't changed
          git diff --staged --quiet || git commit -m "chore: refresh channels $(date -u +%FT%TZ)"
          git push
